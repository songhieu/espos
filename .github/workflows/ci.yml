name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      - name: Build the web app
        run: make web

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build the binary
        run: make server

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: docker build -t espos:ci server

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      # Same toolchain as CrossPoint's CI: the pioarduino core 6.1.19 and the packages its
      # platform imports.
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v1-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v1-${{ runner.os }}-

      # Keep the platform's own penv on the same core (see CrossPoint's CI for why).
      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e default
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build
        run: pio run -e default

      - name: Bundle
        run: scripts/espos_bundle.sh default ../bundle

      - uses: actions/upload-artifact@v6
        with:
          name: espos-firmware-bundle
          path: bundle/
          if-no-files-found: error
