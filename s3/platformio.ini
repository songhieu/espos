; EspOS for the ES3C35P (3.5" ESP32-S3 colour touch display). No book reading.
[env:s3desk]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Since 2026-11-16 the board holds PawBoop's packs in their own partitions (docs/pawboop.md).
; OTA images must stay under the app size, 0x3C0000 = 3,932,160 bytes.
board_build.partitions = partitions_pawboop.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
monitor_speed = 115200
; No C++ exceptions (2026-11-21, docs/partitions.md): nothing catches one, so a throw ended in abort() before too;
; the unwind tables and landing pads were ~300 KB of the image.
build_unflags = -Os -fexceptions
build_flags =
  -O2
  -fno-exceptions
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DESPOS_API=\"https://api.espos.dev\"
  -DESPOS_WEB=\"https://espos.dev\"
lib_deps =
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@7.2.1
; src/bot is the EspOS Bot firmware (env bot128, its own board): never in these builds.
build_src_filter = +<*> -<.git/> -<.svn/> -<bot/>


; The same firmware for boards with partition table v2 (docs/partitions.md: 4.75 MiB app slots, set over USB by
; tools/migrate_v2.py). The image runs on both tables; this env's table is what its bundle carries (make_bundle.py)
; and the slot PlatformIO checks the size against. Release images for v1 boards come from env s3desk.
[env:s3desk-v2]
extends = env:s3desk
board_build.partitions = partitions_v2.csv

; The board with the developer's benchmarks on the dev console (BENCH, TEXTBENCH, PIPEBENCH, LBENCH, RAWBENCH,
; NETBENCH, JSSTACK, CARDBENCH: src/devtools.cpp ESPOS_QA). The release image (env s3desk) leaves them out since
; 0.5.7 to fit the app slot; everything the web installer, the store and QA scripts use stays in both.
[env:s3desk-qa]
extends = env:s3desk
build_flags =
  ${env:s3desk.build_flags}
  -DESPOS_QA

; TEST (2026-11-16): faster downloads. The prebuilt network stack advertises a 5.7 KB TCP window: at the
; storage server's ~0.2 s round trip that caps a download near 20-25 KB/s (12 MB took 10 min). This env rebuilds
; the framework with ONLY network options changed (no PSRAM/XIP/cache changes: those broke TE before).
[env:s3desk-net]
extends = env:s3desk
custom_sdkconfig =
  CONFIG_LWIP_TCP_WND_DEFAULT=32768
  CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
  CONFIG_ESP_WIFI_RX_BA_WIN=16
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y

; QEMU (docs/simulator.md, tools/qemu/run.sh): this firmware in Espressif's emulated ESP32-S3 (both cores, octal PSRAM
; 8 MB, 16 MB flash). Differences: the display is QEMU's virtual panel (src/boards/qemu), touches come from the dev
; console (TAP/DRAG), no WiFi, no sound, no battery; Serial is UART0 (QEMU's serial port), not USB.
[env:s3desk-qemu]
extends = env:s3desk
build_flags =
  -O2
  -fno-exceptions
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DESPOS_QEMU
  -DESPOS_QA
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DESPOS_API=\"https://api.espos.dev\"
  -DESPOS_WEB=\"https://espos.dev\"

; The 2.8" board ES3C28P (docs/boards.md): the same firmware as the 3.5" board (env s3desk) finds it at boot.
; The 2.8" board in QEMU (tools/qemu/run.sh --board 28): a 240x320 window. QEMU has no I2C devices to tell the boards
; apart by (src/boards/boards.cpp), so the board is the build's here. On the boards one firmware (env s3desk) finds
; its board.
[env:s3desk-28-qemu]
extends = env:s3desk-qemu
build_flags =
  ${env:s3desk-qemu.build_flags}
  -DBOARD_ES3C28P

; EspOS Bot (docs in src/bot/config.h): the Xiaozhi-style ESP32-S3 N16R8 board with a 128x64 OLED, an I2S mic and amp,
; no touch. Its own firmware from src/bot (no LVGL), with the S3's wake-word core, licence and trace; the wake model of
; the package dev.espos.wake.gau built in (tools/bot/model.py copies it to .pio/bot; none there: no wake word). Host build of its screens and tests: sim/bot/run.sh.
[env:bot128]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.embed_files = .pio/bot/gau.ewm
extra_scripts = pre:tools/bot/model.py
monitor_speed = 115200
build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DESPOS_BOT
  -DFW_VERSION=\"espos-bot-0.1.1\"
  -DESPOS_API=\"https://api.espos.dev\"
build_src_filter = -<*> +<bot/> +<wake/wake_fe.c> +<wake/wake_rt.c> +<lic.cpp> +<trace.cpp> +<lunar.cpp>
lib_deps =
  bblanchon/ArduinoJson@7.2.1
lib_ignore = lvgl
